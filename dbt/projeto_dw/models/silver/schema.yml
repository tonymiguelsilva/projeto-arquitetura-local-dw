version: 2

models:
  - name: dim_clientes
    description: "Dimensão de clientes"

    columns:
      - name: id_cliente
        description: "Identificador único do cliente"
        data_tests:
          - not_null
          - unique

      - name: nome_cliente
        description: "Nome do cliente"
        data_tests:
          - not_null

      - name: ativo
        description: "Indica se o cliente está ativo"
        data_tests:
          - not_null

  - name: fato_vendas
    description: "Fato de vendas"

    columns:
      - name: id_venda
        description: "Identificador único da venda"
        data_tests:
          - not_null
          - unique

      - name: id_cliente
        description: "Identificador do cliente"
        data_tests:
          - not_null

      - name: id_produto
        description: "Identificador do produto"
        data_tests:
          - not_null

      - name: data_venda
        description: "Data da venda"
        data_tests:
          - not_null

      - name: quantidade
        description: "Quantidade de produtos vendidos"
        data_tests:
          - not_null

      - name: valor_total
        description: "Valor total da venda"
        data_tests:
          - not_null